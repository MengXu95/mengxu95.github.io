title: "Meng Xu"
name: "Meng Xu (许萌)"
description: "Academic homepage of Meng Xu (许萌), professor at Beijing Institute of Technology, researching AI scheduling, evolutionary computation, and data-driven optimization."
url: "https://mengxu95.github.io"
baseurl: ""
repository: "MengXu95/mengxu95.github.io"
timezone: "Asia/Shanghai"
encoding: "utf-8"

source: .
destination: site
layouts_dir: components/layouts
includes_dir: components/includes
include:
  - content
  - assets
  - scripts

exclude:
  - components
  - styles
  - README.md
  - LICENSE
  - Gemfile
  - package.json
  - node_modules
  - site
  - tools
  - .agents

defaults:
  - scope:
      path: "content"
    values:
      layout: page

sass:
  sass_dir: styles
  style: compressed

plugins: []
