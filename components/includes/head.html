<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffdf8">
<meta name="color-scheme" content="light">
<title>{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
<meta name="robots" content="{{ page.robots | default: 'index, follow' }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Meng Xu">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ page.seo_title | default: page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/photo-Meng.jpg' | absolute_url }}">
<meta property="og:image:width" content="1077">
<meta property="og:image:height" content="1077">
<meta name="twitter:card" content="summary">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
